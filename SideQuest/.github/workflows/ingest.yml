name: Ingest hackathons

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Ingestion Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_UNSTOP: ${{ vars.ENABLE_UNSTOP || '1' }}
          ENABLE_DEVFOLIO: ${{ vars.ENABLE_DEVFOLIO || '0' }}
          ENABLE_HACK2SKILL: ${{ vars.ENABLE_HACK2SKILL || '0' }}
          DEBUG_ADAPTER: ${{ vars.DEBUG_ADAPTER || '0' }}
        run: npm run ingest

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hackathons.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-ingest hackathons [skip ci]" && git push)
